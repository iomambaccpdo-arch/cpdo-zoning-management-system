; CPDO Zoning — PHP settings for `php artisan serve` (loaded via scripts\_start-laravel.bat)
; post_max_size must be larger than the total size of all PDFs + form fields in one request.

post_max_size = 128M
upload_max_filesize = 64M
max_file_uploads = 50
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
